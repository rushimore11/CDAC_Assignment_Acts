<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>January Calendar</title>
    <style>
        table { border-collapse: collapse; text-align: center; font-family: sans-serif; }
        th { background-color: purple; color: rgb(10, 10, 10); padding: 10px; }
        th.sun { background-color: orange; }
        td { border: 2px solid #ccc; width: 40px; height: 40px; font-weight: bold; }
        td.sun-day { background-color: green; color: hsl(0, 8%, 5%); }
    </style>
</head>
<body>
    <table>
        <tr>
            <th colspan="7" style="background-color: yellow;" style="color: black;">January</th>
        </tr>
        <tr>
            <th class="sun">Sun</th>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
            <th>Sat</th>
        </tr>
        <tr>
            <td></td><td></td><td></td><td></td><td></td>
            <td>1</td><td>2</td>
        </tr>
        <tr>
            <td class="sun-day">3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td>
        </tr>
        <tr>
            <td class="sun-day">10</td><td>11</td><td>12</td><td>13</td><td>14</td><td>15</td><td>16</td>
        </tr>
        <tr>
            <td class="sun-day">17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td>
        </tr>
        <tr>
            <td class="sun-day">24</td><td>25</td><td>26</td><td>27</td><td>28</td><td>29</td><td>30</td>
        </tr>
        <tr>
            <td class="sun-day">31</td>
            <td></td><td></td><td></td><td></td><td></td><td></td>
        </tr>
    </table>
</body>
</html>
