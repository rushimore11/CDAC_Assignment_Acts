<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample Form</title>
    <style>
        table { border-collapse: collapse; font-family: Arial, sans-serif; width: 450px; }
        td { border: 1px solid #999; padding: 6px; vertical-align: top; }
        td.label { background-color: #f2f2f2; width: 150px; text-align: right; font-weight: bold; }
        .center-btn { text-align: center; background-color: #e0f0e0; }
    </style>
</head>
<body>
    <form>
        <table>
            <tr>
                <td class="label">Last Name</td>
                <td><input type="text" name="lastName" style="width: 95%;"></td>
            </tr>
            <tr>
                <td class="label">First Name</td>
                <td><input type="text" name="firstName" style="width: 95%;"></td>
            </tr>
            <tr>
                <td class="label">Address</td>
                <td><textarea name="address" rows="3" cols="10" style="width: 95%;"></textarea></td>
            </tr>
            <tr>
                <td class="label">City</td>
                <td>
                    <input type="text" name="city" style="width: 50%;"> 
                    <strong>State</strong> <input type="text" name="state" style="width: 20%;">
                </td>
            </tr>
            <tr>
                <td class="label">Zip/Postal Code</td>
                <td><input type="text" name="zip" style="width: 40%;"></td>
            </tr>
            <tr>
                <td class="label">Country</td>
                <td>
                    <select name="country">
                        <option value="Bulgaria">Bulgaria</option>
                        <option value="India">India</option>
                        <option value="USA">USA</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">Phone (country code, area code, number)</td>
                <td>
                    (+<input type="text" style="width: 35px;">) 
                    <input type="text" style="width: 35px;"> - 
                    <input type="text" style="width: 70px;">
                </td>
            </tr>
            <tr>
                <td class="label">E-mail</td>
                <td><input type="email" name="email" style="width: 95%;"></td>
            </tr>
            <tr>
                <td class="label">Birth date</td>
                <td>
                    Month <input type="text" style="width: 30px;"> 
                    Day <input type="text" style="width: 30px;"> 
                    Year (4 digit) <input type="text" style="width: 50px;">
                </td>
            </tr>
            <tr>
                <td class="label">Gender</td>
                <td>
                    <select name="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">Starting date</td>
                <td>
                    <input type="radio" name="start" id="spring" value="Spring"><label for="spring">Spring 2006</label>
                    <input type="radio" name="start" id="summer" value="Summer"><label for="summer">Summer 2006</label>
                </td>
            </tr>
            <tr>
                <td class="label">Comments/Questions</td>
                <td><textarea name="comments" rows="4" style="width: 95%;"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" class="center-btn">
                    <input type="submit" value="Submit"> 
                    <input type="reset" value="Clear This Form">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
