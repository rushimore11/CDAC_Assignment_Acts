<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Name & Address Details</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fbf5e6; padding: 20px; }
        fieldset { border: 1px solid #7f7f7f; margin-bottom: 15px; width: 300px; padding: 10px; }
        legend { font-size: 0.9em; padding: 0 5px; }
        .row { margin-bottom: 8px; }
        label { display: inline-block; width: 120px; }
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>Name Details</legend>
            <div class="row">
                <label for="fav">Favorite Name:</label>
                <input type="text" id="fav">
            </div>
            <div class="row">
                <label for="curr">Current Name:</label>
                <input type="text" id="curr">
            </div>
            <div class="row">
                <label for="next">Your Next Name:</label>
                <input type="text" id="next">
            </div>
        </fieldset>

        <fieldset>
            <legend>Address Details</legend>
            <div class="row">
                <label for="addr">Your Address:</label>
                <select id="addr">
                    <option value="Earth">Earth</option>
                    <option value="MP">MP</option>
                    <option value="UP">UP</option>
                    <option value="TN">TN</option>
                </select>
            </div>
            <div class="row">
                <label>Like It?</label>
                <input type="radio" name="like" id="yes" value="Yes"><label for="yes" style="width:auto; margin-right:10px;">Yes</label>
                <input type="radio" name="like" id="no" value="No"><label for="no" style="width:auto;">No</label>
            </div>
        </fieldset>

        <input type="submit" value="Send Away!">
    </form>
</body>
</html>
