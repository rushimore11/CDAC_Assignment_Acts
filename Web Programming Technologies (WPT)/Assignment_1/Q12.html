<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic form design using HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 2.2em;
            margin-bottom: 5px;
        }
        h3 {
            margin-top: 5px;
            font-size: 1.3em;
        }
        fieldset {
            border: 1px solid #777;
            padding: 20px;
            width: 500px;
        }
        legend {
            font-size: 1.1em;
            padding: 0 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            font-size: 1.05em;
        }
        input[type="text"], input[type="email"], input[type="date"], textarea {
            font-family: Arial, sans-serif;
            padding: 4px;
            border: 1px solid #777;
            border-radius: 2px;
        }
        textarea {
            width: 95%;
            height: 80px;
            resize: both;
        }
        input[type="submit"] {
            padding: 4px 10px;
            background-color: #f0f0f0;
            border: 1px solid #777;
            cursor: pointer;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <h1>GeeksforGeeks</h1>
    <h3>Basic form design using HTML</h3>

    <form>
        <fieldset>
            <legend>Personal Details</legend>
            
            <div class="form-group">
                <label for="fname">First name : </label>
                <input type="text" id="fname" size="30">
            </div>

            <div class="form-group">
                <label for="lname">Last name : </label>
                <input type="text" id="lname" size="30">
            </div>

            <div class="form-group">
                <label>Gender : </label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male" style="font-weight: normal;">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female" style="font-weight: normal;">Female</label>
            </div>

            <div class="form-group">
                <label for="email">Email : </label>
                <input type="email" id="email" size="35">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth : </label>
                <input type="date" id="dob">
            </div>

            <div class="form-group">
                <label for="address">Address : </label><br>
                <textarea id="address"></textarea>
            </div>

            <input type="submit" value="Submit">
        </fieldset>
    </form>

</body>
</html>
