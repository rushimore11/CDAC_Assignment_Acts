<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Blocks</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 30px;
            background-color: #f9f9f9;
            }
        .card-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px;
         }
        .card {
            background: white; 
            border-radius: 8px; padding: 20px; 
            width: 280px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         }
        .card h3 { 
            margin-top: 0;
            color: #2c3e50; 
        }
        .card p {
             margin: 6px 0; 
             color: #555; 
             font-size: 14px;
             }
        .badge { display: inline-block; 
            background: #3498db; 
            color: white; padding: 3px 8px; 
            border-radius: 4px; font-size: 12px;
         }
    </style>
</head>
<body>

    <h3>User Profile Blocks</h3>
    <div class="card-container" id="cardContainer"></div>

    <script>
        const billionairesData = [
            { "name": "Bill Gates", "rank": 1, "year": 2014, "company": { "name": "Microsoft", "sector": "Software" }, "citizenship": "United States", "wealth": { "worth in billions": 76.0 } },
            { "name": "Warren Buffett", "rank": 2, "year": 2001, "company": { "name": "Berkshire Hathaway", "sector": "Finance" }, "citizenship": "United States", "wealth": { "worth in billions": 32.3 } },
            { "name": "Carlos Slim Helu", "rank": 2, "year": 2014, "company": { "name": "Telmex", "sector": "Communications" }, "citizenship": "Mexico", "wealth": { "worth in billions": 72.0 } },
            { "name": "Oeri Hoffman and Sacher", "rank": 3, "year": 1996, "company": { "name": "F. Hoffmann-La Roche", "sector": "pharmaceuticals" }, "citizenship": "Switzerland", "wealth": { "worth in billions": 13.1 } }
        ];

        const container = document.getElementById('cardContainer');

        billionairesData.forEach(user => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <span class="badge">Rank #${user.rank} (${user.year})</span>
                <h3>${user.name}</h3>
                <p><strong>Company:</strong> ${user.company.name}</p>
                <p><strong>Sector:</strong> ${user.company.sector}</p>
                <p><strong>Net Worth:</strong> $${user.wealth["worth in billions"]} Billion</p>
                <p><strong>Country:</strong> ${user.citizenship}</p>
            `;
            container.appendChild(card);
        });
    </script>

</body>
</html>
