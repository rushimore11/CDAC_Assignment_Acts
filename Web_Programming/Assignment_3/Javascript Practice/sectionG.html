<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Section G - UI Tables</title>
    <style>
        table { width: 60%; margin: 20px 0; border-collapse: collapse; text-align: left; font-family: sans-serif; }
        th, td { padding: 12px; border: 1px solid #ddd; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Section G: Interactive Prompt Tables</h1>

    <h3>Employee Details Table (Q3)</h3>
    <table id="empTable">
        <thead><tr><th>Id</th><th>Name</th><th>Phone</th><th>Salary</th></tr></thead>
        <tbody></tbody>
    </table>

    <h3>Movies Details Table (Q4 - Compulsory)</h3>
    <table id="movieTable">
        <thead><tr><th>Movie Name</th><th>Price</th><th>Seat</th></tr></thead>
        <tbody></tbody>
    </table>

    <script>
        // 1. Take string input from user and remove duplicate words
        let userInput = prompt("Sentence Filter: Enter text containing duplicate words:");
        if (userInput) {
            let uniqueWords = [...new Set(userInput.split(" "))];
            console.log("Q1. Deduplicated String output:", uniqueWords.join(" "));
        }

        // 2. Accepts a sequence of comma separated five numbers and find the addition
        let inputNumbers = prompt("Math: Enter exactly 5 numbers separated by commas (e.g., 2,4,6,8,10):");
        if (inputNumbers) {
            let sumTotal = inputNumbers.split(",").map(Number).reduce((sum, current) => sum + current, 0);
            alert(`Q2. Total Sum of the 5 values: ${sumTotal}`);
        }

        // 3. Take 3 employee details from prompt and show in table
        let empTbody = document.querySelector("#empTable tbody");
        for (let i = 0; i < 3; i++) {
            let id = prompt(`[Employee ${i+1}/3] Enter ID:`);
            let name = prompt(`[Employee ${i+1}/3] Enter Name:`);
            let phone = prompt(`[Employee ${i+1}/3] Enter Phone:`);
            let salary = prompt(`[Employee ${i+1}/3] Enter Salary:`);
            
            let row = `<tr><td>${id}</td><td>${name}</td><td>${phone}</td><td>${salary}</td></tr>`;
            empTbody.innerHTML += row;
        }

        // 4 (Compulsory). Take 3 Movies details from prompt and show in table
        let movieTbody = document.querySelector("#movieTable tbody");
        for (let i = 0; i < 3; i++) {
            let movieName = prompt(`[Movie ${i+1}/3] Enter Movie Name:`);
            let price = prompt(`[Movie ${i+1}/3] Enter Ticket Price:`);
            let seat = prompt(`[Movie ${i+1}/3] Enter Seat Number/Count:`);
            
            let row = `<tr><td>${movieName}</td><td>${price}</td><td>${seat}</td></tr>`;
            movieTbody.innerHTML += row;
        }
    </script>
</body>
</html>
