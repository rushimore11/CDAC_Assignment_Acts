<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Section E - Sequences</title>
</head>
<body>
    <h1>Section E: Sequences & Algorithms</h1>
    <p>Open browser console logs to see generated values.</p>

    <script>
        // 1. Print fibonacci series till 100
        console.log("Q1. Fibonacci Series up to 100:");
        let t1 = 1, t2 = 1, nextTerm = 0;
        console.log(t1);
        console.log(t2);
        nextTerm = t1 + t2;
        while (nextTerm <= 100) {
            console.log(nextTerm);
            t1 = t2;
            t2 = nextTerm;
            nextTerm = t1 + t2;
        }

        // 2. Check if a given string is a palindrome
        let checkStr = "abba";
        let reversedStr = checkStr.split("").reverse().join("");
        if (checkStr === reversedStr) {
            console.log(`Q2. "${checkStr}" is a valid palindrome.`);
        } else {
            console.log(`Q2. "${checkStr}" is NOT a palindrome.`);
        }
    </script>
</body>
</html>
