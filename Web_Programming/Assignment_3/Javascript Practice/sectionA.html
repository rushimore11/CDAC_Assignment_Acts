<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Section A - Basic Math</title>
</head>
<body>
    <h1>Section A: Basic Math Operations</h1>
    <p>Press <strong>F12</strong> and look at your browser <strong>Console</strong> to see the results.</p>

    <script>
        // 1. Subtraction of two numbers
        let num1 = 15;
        let num2 = 7;
        let diff = num1 - num2;
        console.log("Q1. Subtraction Result (15 - 7):", diff);

        // 2. Multiplication of three numbers
        let a = 2, b = 4, c = 5;
        let product = a * b * c;
        console.log("Q2. Multiplication Result (2 * 4 * 5):", product);
    </script>
</body>
