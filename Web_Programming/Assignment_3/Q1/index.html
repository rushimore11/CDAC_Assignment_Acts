<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEM KIT</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        /* Flexbox implementation as instructed */
        .hero {
            background-color: #0099e5;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .hero__title {
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .hero__subtitle {
            font-size: 1.2rem;
            margin: 0 0 30px 0;
            opacity: 0.9;
        }
        .hero__actions {
            display: flex;
            gap: 15px;
        }
        .btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 12px 30px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <header class="hero">
        <h1 class="hero__title">BEM KIT</h1>
        <p class="hero__subtitle">CSS UI Kit using BEM in class naming standard</p>
        <div class="hero__actions">
            <a href="#" class="btn"><span class="icon">🏠</span> Homepage</a>
            <a href="#" class="btn"><span class="icon">☁️</span> Download</a>
            <a href="#" class="btn"><span class="icon">🐙</span> Source Code</a>
        </div>
    </header>
</body>
</html>
