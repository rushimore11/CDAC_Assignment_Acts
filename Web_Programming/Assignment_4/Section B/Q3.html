<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Country State City Selector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .container {
            width: 350px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Location Selector</h2>

        <div class="form-group">
            <label for="country">Select Country:</label>
            <select id="country" onchange="loadStates()">
                <option value="">-- Select Country --</option>
            </select>
        </div>

     
        <div class="form-group">
            <label for="state">Select State:</label>
            <select id="state" onchange="loadCities()" disabled>
                <option value="">-- Select State --</option>
            </select>
        </div>

      
        <div class="form-group">
            <label for="city">Select City:</label>
            <select id="city" disabled>
                <option value="">-- Select City --</option>
            </select>
        </div>
    </div>

    <script>
     
        var locationData = {
            "USA": {
                "California": ["Los Angeles", "San Francisco", "San Diego"],
                "Texas": ["Houston", "Austin", "Dallas"],
                "New York": ["New York City", "Buffalo", "Rochester"]
            },
            "India": {
                "Maharashtra": ["Mumbai", "Pune", "Nagpur"],
                "Karnataka": ["Bengaluru", "Mysore", "Hubli"],
                "Delhi": ["New Delhi", "North Delhi", "South Delhi"]
            },
            "Canada": {
                "Ontario": ["Toronto", "Ottawa", "Hamilton"],
                "Quebec": ["Montreal", "Quebec City", "Laval"],
                "British Columbia": ["Vancouver", "Victoria", "Surrey"]
            }
        };

      
        window.onload = function() {
            var countrySelect = document.getElementById("country");
            
        
            for (var country in locationData) {
                var option = document.createElement("option");
                option.value = country;
                option.textContent = country;
                countrySelect.appendChild(option);
            }
        };

        function loadStates() {
            var countrySelect = document.getElementById("country");
            var stateSelect = document.getElementById("state");
            var citySelect = document.getElementById("city");

            var selectedCountry = countrySelect.value;

            stateSelect.innerHTML = '<option value="">-- Select State --</option>';
            citySelect.innerHTML = '<option value="">-- Select City --</option>';

            if (selectedCountry) {
                stateSelect.disabled = false;
                citySelect.disabled = true;

             
                var states = locationData[selectedCountry];
                for (var state in states) {
                    var option = document.createElement("option");
                    option.value = state;
                    option.textContent = state;
                    stateSelect.appendChild(option);
                }
            } else {
                stateSelect.disabled = true;
                citySelect.disabled = true;
            }
        }

     
        function loadCities() {
            var countrySelect = document.getElementById("country");
            var stateSelect = document.getElementById("state");
            var citySelect = document.getElementById("city");

            var selectedCountry = countrySelect.value;
            var selectedState = stateSelect.value;

        
            citySelect.innerHTML = '<option value="">-- Select City --</option>';

            if (selectedState) {
                citySelect.disabled = false;

            
                var cities = locationData[selectedCountry][selectedState];
                for (var i = 0; i < cities.length; i++) {
                    var option = document.createElement("option");
                    option.value = cities[i];
                    option.textContent = cities[i];
                    citySelect.appendChild(option);
                }
            } else {
                citySelect.disabled = true;
            }
        }
    </script>

</body>
</html>
