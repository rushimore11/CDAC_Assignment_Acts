<!DOCTYPE html>
<html lang="en">

    <title>Nested list</title>
</head>
<body>
    <fieldset>
        <h2>Student List</h2>
    <ol>
        <li>Group 1
            <ol type="A">
                <li>Anubhav</li>
                <li>Atul</li>
            </ol>
        </li>
        <li>Group 2
            <ol type="A">
                <li>Siddhant</li>
                <li>Sid</li>
            </ol>
        </li>
        <li>Group 3
            <ol type="A">
                <li>Neha</li>
            </ol>
        </li>
    </ol>
</fieldset>
    
</body>
</html>
